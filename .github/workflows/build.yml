name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK packages
        run: |
          if [ ! -d $ANDROID_HOME/build-tools/34.0.0 ] || [ ! -d $ANDROID_HOME/platforms/android-34 ]; then
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" < <(yes)
          fi

      - name: Godot cache
        id: gc
        uses: actions/cache@v4
        with:
          path: ~/gd
          key: godot-4.3-android-v1

      - name: Download Godot (first time only)
        if: steps.gc.outputs.cache-hit != 'true'
        run: |
          V=4.3-stable
          mkdir -p ~/gd/templates
          wget -q https://github.com/godotengine/godot/releases/download/$V/Godot_v${V}_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/$V/Godot_v${V}_export_templates.tpz
          unzip -q Godot_v${V}_linux.x86_64.zip
          mv Godot_v${V}_linux.x86_64 ~/gd/godot
          unzip -q Godot_v${V}_export_templates.tpz 'templates/android*' 'templates/version.txt' -d tpl
          mv tpl/templates/* ~/gd/templates/

      - name: Keystore cache
        uses: actions/cache@v4
        with:
          path: ~/debug.keystore
          key: debug-keystore-v1

      - name: Setup Godot
        run: |
          sudo cp ~/gd/godot /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          cp -r ~/gd/templates/* ~/.local/share/godot/export_templates/4.3.stable/
          [ -f $HOME/debug.keystore ] || keytool -genkeypair -keystore $HOME/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOF2
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/shutdown_adb_on_exit = true
          EOF2

      - name: Export APK
        run: |
          godot --headless --import || true
          mkdir -p build
          godot --headless --export-debug "Android" build/adventure3d.apk
          test -f build/adventure3d.apk

      - uses: actions/upload-artifact@v4
        with:
          name: adventure3d-apk
          path: build/adventure3d.apk
          compression-level: 0
